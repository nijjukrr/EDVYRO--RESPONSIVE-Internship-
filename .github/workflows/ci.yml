name: InternBoard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate syntax across frontend and backend modules
        run: |
          for f in js/*.js backend/src/*.js backend/src/*/*.js backend/database/*.js backend/scripts/*.js; do
            node --check "$f"
          done
      - name: Run frontend unit and build integrity tests
        run: node --test tests/frontend.test.mjs

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend SQLite, PostgreSQL & security tests
        working-directory: backend
        run: npm test
