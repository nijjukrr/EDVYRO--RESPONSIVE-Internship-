<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" fill="none">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#080808" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Monochrome studio canvas -->
  <rect x="20" y="20" width="480" height="360" rx="20" fill="#F7F7F7" stroke="#E6E6E6" stroke-width="1.5" />
