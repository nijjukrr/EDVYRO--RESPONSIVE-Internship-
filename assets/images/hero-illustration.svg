<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" fill="none">
  <defs>
    <linearGradient id="bg-glow" x1="40" y1="20" x2="480" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Soft geometric canvas -->
  <rect x="20" y="20" width="480" height="360" rx="28" fill="url(#bg-glow)" stroke="#E2E8F0" stroke-width="1.5" />
  <circle cx="430" cy="85" r="52" fill="#E0E7FF" opacity="0.65" />
  <circle cx="88" cy="318" r="42" fill="#DBEAFE" opacity="0.7" />

  <!-- Top search bar preview -->
  <g filter="url(#card-shadow)">
    <rect x="64" y="54" width="392" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <circle cx="94" cy="80" r="9" stroke="#4F46E5" stroke-width="2.2" />
    <path d="M101 87L106 92" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" />
    <rect x="118" y="74" width="136" height="12" rx="6" fill="#E2E8F0" />
    <rect x="358" y="66" width="84" height="28" rx="8" fill="url(#accent-grad)" />
    <rect x="378" y="77" width="44" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Featured card preview -->
  <g filter="url(#card-shadow)">
    <rect x="64" y="128" width="248" height="196" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="86" y="150" width="40" height="40" rx="10" fill="#EEF2FF" />
    <path d="M99 170L106 163L113 170M106 163V178" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="138" y="154" width="118" height="12" rx="6" fill="#0F172A" opacity="0.85" />
    <rect x="138" y="174" width="84" height="9" rx="4.5" fill="#94A3B8" />
    <rect x="86" y="210" width="204" height="8" rx="4" fill="#E2E8F0" />
    <rect x="86" y="226" width="172" height="8" rx="4" fill="#E2E8F0" />

    <!-- Skill pills -->
    <rect x="86" y="252" width="54" height="22" rx="11" fill="#EEF2FF" />
    <rect x="97" y="260" width="32" height="6" rx="3" fill="#4F46E5" opacity="0.7" />
    <rect x="148" y="252" width="58" height="22" rx="11" fill="#EFF6FF" />
    <rect x="160" y="260" width="34" height="6" rx="3" fill="#2563EB" opacity="0.7" />
    <rect x="214" y="252" width="56" height="22" rx="11" fill="#F1F5F9" />
    <rect x="225" y="260" width="34" height="6" rx="3" fill="#64748B" opacity="0.7" />

    <rect x="86" y="290" width="204" height="18" rx="6" fill="url(#accent-grad)" opacity="0.14" />
    <rect x="148" y="296" width="80" height="6" rx="3" fill="#4F46E5" />
  </g>

  <!-- Right filter & domain summary card -->
  <g filter="url(#card-shadow)">
    <rect x="330" y="128" width="126" height="94" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="348" y="148" width="52" height="8" rx="4" fill="#64748B" opacity="0.6" />
    <rect x="348" y="168" width="90" height="14" rx="7" fill="#EEF2FF" />
    <circle cx="360" cy="175" r="4" fill="#4F46E5" />
    <rect x="370" y="172" width="54" height="6" rx="3" fill="#4F46E5" opacity="0.7" />
    <rect x="348" y="192" width="82" height="14" rx="7" fill="#ECFDF5" />
    <circle cx="360" cy="199" r="4" fill="#10B981" />
    <rect x="370" y="196" width="46" height="6" rx="3" fill="#059669" opacity="0.7" />
  </g>

  <!-- Right bottom keyboard/accessibility card -->
  <g filter="url(#card-shadow)">
    <rect x="330" y="238" width="126" height="86" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="348" y="256" width="64" height="8" rx="4" fill="#0F172A" opacity="0.75" />
    <path d="M350 298L374 282L394 290L432 268" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="432" cy="268" r="5" fill="#4F46E5" />
  </g>
</svg>
