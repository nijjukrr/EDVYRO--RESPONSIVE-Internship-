    <rect x="160" y="260" width="34" height="6" rx="3" fill="#666666" />
    <rect x="214" y="252" width="56" height="22" rx="11" fill="#F1F1F1" stroke="#E6E6E6" />
    <rect x="225" y="260" width="34" height="6" rx="3" fill="#666666" />

    <rect x="86" y="290" width="204" height="18" rx="6" fill="#050505" />
    <rect x="148" y="296" width="80" height="6" rx="3" fill="#FFFFFF" />
  </g>

  <!-- Right filter summary card -->
  <g filter="url(#card-shadow)">
    <rect x="330" y="128" width="126" height="94" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.2" />
    <rect x="348" y="148" width="52" height="8" rx="4" fill="#666666" />
    <rect x="348" y="168" width="90" height="14" rx="7" fill="#F1F1F1" />
