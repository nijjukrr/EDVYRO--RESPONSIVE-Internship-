    <path d="M101 87L106 92" stroke="#080808" stroke-width="2.2" stroke-linecap="round" />
    <rect x="118" y="74" width="136" height="12" rx="6" fill="#E6E6E6" />
    <rect x="358" y="66" width="84" height="28" rx="8" fill="#050505" />
