    <rect x="86" y="226" width="172" height="8" rx="4" fill="#E6E6E6" />

    <!-- Monochrome skill pills -->
    <rect x="86" y="252" width="54" height="22" rx="11" fill="#F1F1F1" stroke="#E6E6E6" />
    <rect x="97" y="260" width="32" height="6" rx="3" fill="#666666" />
